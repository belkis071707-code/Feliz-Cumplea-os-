<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            text-align: center;
        }
        .container {
            position: relative;
            z-index: 2;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2.5rem;
            color: #ffd700;
            margin-top: 40px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #e0e0e0;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            margin: 20px 0;
        }
        .foto-container {
            margin: 30px auto;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        .foto-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Estrellas de fondo */
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: animateStar linear infinite;
        }
        @keyframes animateStar {
            0% { transform: translateY(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-100vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Fondo de estrellas animadas -->
    <div id="stars"></div>

    <div class="container">
        <h1>¡Feliz Cumpleaños! 🎉</h1>
        
        <!-- Reemplaza el enlace de la imagen de abajo con la foto que quieras -->
        <div class="foto-container">
            <img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=500&q=80" alt="Foto de Cumpleaños">
        </div>

        <p>
            Hoy es un día muy especial y quiero recordarte lo increíble que eres. Que este nuevo año de vida esté lleno de metas cumplidas, muchísima alegría y momentos inolvidables. ¡Disfruta tu día al máximo! 🎂✨
        </p>
    </div>

    <script>
        // Crear estrellas flotantes en el fondo
        const starsContainer = document.getElementById('stars');
        const numStars = 50;
        for (let i = 0; i < numStars; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 100}vw`;
            star.style.top = `${Math.random() * 100}vh`;
            star.style.animationDuration = `${Math.random() * 3 + 2}s`;
            star.style.animationDelay = `${Math.random() * 2}s`;
            starsContainer.appendChild(star);
        }
    </script>
</body>
</html>
