<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1b1b3a 0%, #0b0f19 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Título con efecto de brillo tridimensional y flotación */
        h1 {
            font-size: 4.5rem;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 0 40px rgba(255, 105, 180, 0.6);
            z-index: 10;
            animation: pulseTitle 3s ease-in-out infinite;
        }

        @keyframes pulseTitle {
            0%, 100% { transform: scale(1); text-shadow: 0 0 20px rgba(255, 215, 0, 0.8); }
            50% { transform: scale(1.05); text-shadow: 0 0 35px rgba(255, 215, 0, 1), 0 0 60px rgba(255, 105, 180, 0.9); }
        }

        p {
            font-size: 1.6rem;
            max-width: 650px;
            margin: 0 auto;
            line-height: 1.6;
            z-index: 10;
            padding: 0 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        /* Fondo dinámico de estrellas */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.3) 2px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.2) 1px, transparent 2px);
            background-size: 400px 400px, 200px 200px;
            z-index: 1;
            animation: moveStars 60s linear infinite;
        }

        @keyframes moveStars {
            from { background-position: 0 0, 0 0; }
            to { background-position: 1000px 1000px, 500px 500px; }
        }

        /* Elementos que giran y se mueven */
        .orbit-element {
            position: absolute;
            font-size: 2.8rem;
            z-index: 5;
            pointer-events: none;
            animation: complexMotion linear infinite, spinItem linear infinite;
        }

        @keyframes complexMotion {
            0% {
                transform: translate(calc(50vw + cos(0deg) * 150px), calc(50vh + sin(0deg) * 150px));
            }
            50% {
                transform: translate(calc(10vw + cos(180deg) * 350px), calc(20vh + sin(180deg) * 250px));
            }
            100% {
                transform: translate(calc(50vw + cos(360deg) * 150px), calc(50vh + sin(360deg) * 150px));
            }
        }

        @keyframes spinItem {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* Confetti */
        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            opacity: 1;
            z-index: 5;
            pointer-events: none;
        }

        /* Botón elegante */
        .copy-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #34d399, #059669);
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(52, 211, 153, 0.4);
            transition: all 0.3s ease;
            z-index: 100;
        }
        .copy-btn:hover {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 6px 20px rgba(52, 211, 153, 0.6);
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="container">
        <h1>¡Feliz Cumpleaños!</h1>
        <p>¡Que este día esté lleno de alegría, sorpresas y mucha magia! 🎉<br>Disfruta cada momento y que todos tus deseos se cumplan.</p>
    </div>

    <button class="copy-btn" onclick="copiarEnlace()">Copiar enlace para WhatsApp</button>

    <script>
        // Creación masiva de elementos giratorios y con movimiento en órbita
        const simbolos = ['🎈', '🎁', '🎀', '⭐', '🎂', '🎉', '💖', '🎁', '🎈'];
        const numElementos = 18; // Cantidad de objetos flotando al mismo tiempo

        for (let i = 0; i < numElementos; i++) {
            const el = document.createElement('div');
            el.classList.add('orbit-element');
            el.innerText = simbolos[Math.floor(Math.random() * simbolos.length)];
            
            // Asignar posiciones y velocidades aleatorias únicas para cada elemento
            const randomX = Math.random() * window.innerWidth;
            const randomY = Math.random() * window.innerHeight;
            el.style.left = randomX + 'px';
            el.style.top = randomY + 'px';

            const duracionMovimiento = Math.random() * 8 + 12; // Entre 12 y 20 segundos
            const duracionGiro = Math.random() * 3 + 2;        // Entre 2 y 5 segundos
            
            el.style.animationDuration = `${duracionMovimiento}s, ${duracionGiro}s`;
            
            // Variar las trayectorias
            el.style.animationName = 'floatDynamic, spinItem';
            el.style.animationIterationCount = 'infinite';
            el.style.animationTimingFunction = 'ease-in-out';

            document.body.appendChild(el);
        }

        // Animación dinámica personalizada vía JS inyectado
        const styleSheet = document.styleSheets[0];
        styleSheet.insertRule(`
            @keyframes floatDynamic {
                0% { transform: translate(0, 0) scale(1); }
                25% { transform: translate(${Math.random() * 200 - 100}px, ${Math.random() * 200 - 100}px) scale(1.1); }
                50% { transform: translate(${Math.random() * 300 - 150}px, ${Math.random() * 300 - 150}px) scale(0.9); }
                75% { transform: translate(${Math.random() * 200 - 100}px, ${Math.random() * 200 - 100}px) scale(1.2); }
                100% { transform: translate(0, 0) scale(1); }
            }
        `, styleSheet.cssRules.length);

        // Efecto de confeti mejorado al hacer clic en cualquier parte
        document.body.addEventListener('click', function(e) {
            lanzarConfeti(e.clientX, e.clientY);
        });

        function lanzarConfeti(x, y) {
            const colores = ['#ff2a6d', '#05d9e8', '#ffc700', '#d80032', '#7928ca', '#34d399'];
            for (let i = 0; i < 40; i++) {
                const confeti = document.createElement('div');
                confeti.classList.add('confetti');
                confeti.style.backgroundColor = colores[Math.floor(Math.random() * colores.length)];
                confeti.style.left = x + 'px';
                confeti.style.top = y + 'px';
                if(Math.random() > 0.4) confeti.style.borderRadius = '50%';
                
                document.body.appendChild(confeti);
                
                const angulo = Math.random() * Math.PI * 2;
                const fuerza = Math.random() * 180 + 50;
                const destinoX = x + Math.cos(angulo) * fuerza;
                const destinoY = y + Math.sin(angulo) * fuerza + 80;
                const duracion = Math.random() * 1200 + 800;
                const rotacion = Math.random() * 1080;

                confeti.animate([
                    { transform: `translate(0, 0) rotate(0deg) scale(1)`, opacity: 1 },
                    { transform: `translate(${destinoX - x}px, ${destinoY - y}px) rotate(${rotacion}deg) scale(0.5)`, opacity: 0 }
                ], { duration: duracion, easing: 'cubic-bezier(0.1, 0.8, 0.3, 1)', fill: 'forwards' });

                setTimeout(() => confeti.remove(), duracion);
            }
        }

        function copiarEnlace() {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                const btn = document.querySelector('.copy-btn');
                const textoOriginal = btn.innerText;
                btn.innerText = '¡Enlace copiado con éxito! ✨';
                btn.style.background = 'linear-gradient(135deg, #fbbf24, #d97706)';
                setTimeout(() => {
                    btn.innerText = textoOriginal;
                    btn.style.background = 'linear-gradient(135deg, #34d399, #059669)';
                }, 2000);
            });
        }
    </script>
</body>
</html>
