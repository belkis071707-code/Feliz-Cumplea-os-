<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Sorpresa de Cumpleaños!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1b1b3a 0%, #0b0f19 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Fondo de estrellas */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.3) 2px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.2) 1px, transparent 2px);
            background-size: 400px 400px, 200px 200px;
            z-index: 1;
        }

        /* --- PANTALLA INICIAL: EL REGALO CERRADO --- */
        #gift-container {
            z-index: 50;
            cursor: pointer;
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: bounceGift 2s infinite ease-in-out;
        }

        #gift-container:hover {
            transform: scale(1.1);
        }

        .gift-box {
            font-size: 7rem;
            filter: drop-shadow(0 0 20px rgba(255, 105, 180, 0.6));
        }

        .gift-text {
            font-size: 1.5rem;
            margin-top: 15px;
            color: #ffc700;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            font-weight: bold;
        }

        @keyframes bounceGift {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* --- CONTENIDO OCULTO HASTA TOCAR EL REGALO --- */
        #card-content {
            display: none;
            opacity: 0;
            transition: opacity 1.5s ease;
            z-index: 10;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 0 40px rgba(255, 105, 180, 0.6);
            animation: pulseTitle 3s ease-in-out infinite;
        }

        @keyframes pulseTitle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        p {
            font-size: 1.6rem;
            max-width: 650px;
            margin: 0 auto;
            line-height: 1.6;
            padding: 0 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        /* Elementos que giran y se mueven (globos y regalos) */
        .orbit-element {
            position: absolute;
            font-size: 2.8rem;
            z-index: 5;
            pointer-events: none;
        }

        /* Botón elegante */
        .copy-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #34d399, #059669);
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(52, 211, 153, 0.4);
            transition: all 0.3s ease;
            z-index: 100;
        }
        .copy-btn:hover {
            transform: translateX(-50%) scale(1.05);
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <!-- Regalo inicial que el usuario debe tocar -->
    <div id="gift-container" onclick="abrirRegalo()">
        <div class="gift-box">🎁</div>
        <div class="gift-text">¡Toca el regalo para abrir tu sorpresa! ✨</div>
    </div>

    <!-- Contenido de la tarjeta (inicialmente oculto) -->
    <div id="card-content">
        <h1>¡Feliz Cumpleaños!</h1>
        <p>¡Que este día esté lleno de alegría, sorpresas y mucha magia! 🎉<br>Disfruta cada momento y que todos tus deseos se cumplan.</p>
    </div>

    <button class="copy-btn" onclick="copiarEnlace()">Copiar enlace para WhatsApp</button>

    <!-- Audio sintetizado con la melodía de Feliz Cumpleaños (funciona sin archivos externos) -->
    <script>
        let audioCtx = null;

        function reproducirMusicaCumpleanos() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // Notas de la melodía de "Cumpleaños Feliz"
                // Frecuencias en Hz
                const G4 = 392.00;
                const A4 = 440.00;
                const C5 = 523.25;
                const B4 = 493.88;
                const E5 = 659.25;
                const D5 = 587.33;

                const melodia = [
                    { nota: G4, duracion: 0.25 }, { nota: G4, duracion: 0.25 },
                    { nota: A4, duracion: 0.5 },  { nota: G4, duracion: 0.5 },
                    { nota: C5, duracion: 0.5 },  { nota: B4, duracion: 1.0 },
                    
                    { nota: G4, duracion: 0.25 }, { nota: G4, duracion: 0.25 },
                    { nota: A4, duracion: 0.5 },  { nota: G4, duracion: 0.5 },
                    { nota: D5, duracion: 0.5 },  { nota: C5, duracion: 1.0 },
                    
                    { nota: G4, duracion: 0.25 }, { nota: G4, duracion: 0.25 },
                    { nota: E5, duracion: 0.5 },  { nota: C5, duracion: 0.5 },
                    { nota: B4, duracion: 0.5 },  { nota: A4, duracion: 1.0 },
                    
                    { nota: F5 = 698.46, duracion: 0.25 }, { nota: F5, duracion: 0.25 },
                    { nota: E5, duracion: 0.5 },  { nota: C5, duracion: 0.5 },
                    { nota: D5, duracion: 0.5 },  { nota: C5, duracion: 1.0 }
                ];

                let tiempoActual = audioCtx.currentTime;

                melodia.forEach(item => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    
                    osc.type = 'triangle'; // Sonido suave tipo cajita musical
                    osc.frequency.setValueAtTime(item.nota, tiempoActual);
                    
                    gain.gain.setValueAtTime(0.15, tiempoActual);
                    gain.gain.exponentialRampToValueAtTime(0.001, tiempoActual + item.duracion * 0.9);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(tiempoActual);
                    osc.stop(tiempoActual + item.duracion);
                    
                    tiempoActual += item.duracion;
                });
            } catch(e) {
                console.log("Audio no soportado automáticamente");
            }
        }

        function abrirRegalo() {
            // 1. Ocultar el regalo con animación
            const giftContainer = document.getElementById('gift-container');
            giftContainer.style.transform = 'scale(2)';
            giftContainer.style.opacity = '0';
            setTimeout(() => {
                giftContainer.style.display = 'none';
            }, 300);

            // 2. Mostrar la tarjeta de cumpleaños
            const cardContent = document.getElementById('card-content');
            cardContent.style.display = 'flex';
            setTimeout(() => {
                cardContent.style.opacity = '1';
            }, 50);

            // 3. Reproducir la música
            reproducirMusicaCumpleanos();

            // 4. Iniciar globos y regalos flotantes giratorios alrededor
            iniciarAnimacionGlobosYRegalos();
        }

        function iniciarAnimacionGlobosYRegalos() {
            const simbolos = ['🎈', '🎁', '🎈', '🎉', '⭐', '🎁', '💖', '🎈'];
            const numElementos = 16;

            for (let i = 0; i < numElementos; i++) {
                const el = document.createElement('div');
                el.classList.add('orbit-element');
                el.innerText = simbolos[Math.floor(Math.random() * simbolos.length)];
                
                let posX = Math.random() * window.innerWidth;
                let posY = Math.random() * window.innerHeight;
                el.style.left = posX + 'px';
                el.style.top = posY + 'px';

                document.body.appendChild(el);

                // Animación fluida con JS para que se muevan y giren constantemente
                animarElemento(el);
            }
        }

        function animarElemento(el) {
            let x = parseFloat(el.style.left);
            let y = parseFloat(el.style.top);
            let velX = (Math.random() - 0.5) * 2;
            let velY = (Math.random() - 0.5) * 2;
            let rot = Math.random() * 360;
            let velRot = (Math.random() - 0.5) * 3;

            function mover() {
                x += velX;
                y += velY;
                rot += velRot;

                // Rebote en los bordes de la pantalla
                if (x < 0 || x > window.innerWidth - 50) velX *= -1;
                if (y < 0 || y > window.innerHeight - 50) velY *= -1;

                el.style.left = x + 'px';
                el.style.top = y + 'px';
                el.style.transform = `rotate(${rot}deg)`;

                requestAnimationFrame(mover);
            }
            mover();
        }

        function copiarEnlace() {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                const btn = document.querySelector('.copy-btn');
                const textoOriginal = btn.innerText;
                btn.innerText = '¡Enlace copiado con éxito! ✨';
                btn.style.background = 'linear-gradient(135deg, #fbbf24, #d97706)';
                setTimeout(() => {
                    btn.innerText = textoOriginal;
                    btn.style.background = 'linear-gradient(135deg, #34d399, #059669)';
                }, 2000);
            });
        }
    </script>
</body>
</html>
